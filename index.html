<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemi Mahal ve İş Takip Sistemi</title>
    <!-- Tailwind CSS Tasarım Kütüphanesi -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Supabase Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #ayrac {
            cursor: col-resize;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 h-screen flex flex-col overflow-hidden font-sans transition-colors duration-200">

    <!-- ÜST HEADER -->
    <header class="bg-slate-900 dark:bg-slate-900 border-b border-slate-800 text-white px-6 py-3 flex justify-between items-center shadow-md">
        <h1 class="text-lg font-bold tracking-wide flex items-center gap-2">
            🚢 Gemi Mahal & İş Takip Sistemi
        </h1>
        <div class="flex items-center gap-3">
            <button onclick="temaDegistir()" id="temaBtn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs px-3 py-1.5 rounded-lg font-semibold transition-colors flex items-center gap-1.5 text-white">
                🌙 Karanlık Mod
            </button>
            <span class="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-300 border border-slate-700">Canlı Veritabanı</span>
        </div>
    </header>

    <div id="anaKapsayici" class="flex h-full w-full relative overflow-hidden">
        
        <!-- SOL PANEL: Mahaller ve Akordeon -->
        <div id="solPanel" class="p-5 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 overflow-y-auto flex flex-col shadow-sm transition-colors duration-200" style="width: 38%;">
            <h2 class="text-base font-bold mb-3 text-slate-800 dark:text-slate-200 uppercase tracking-wider">Mahaller</h2>
            
            <!-- Mahal Arama -->
            <div class="mb-3">
                <input 
                    type="text" 
                    id="solAramaInput" 
                    placeholder="Mahal ara..." 
                    class="border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 p-2.5 rounded-lg w-full text-sm outline-none focus:border-blue-500 transition-all"
                    oninput="filtreleMahaller()"
                />
            </div>

            <!-- Yeni Mahal Ekleme -->
            <div class="flex gap-2 mb-4">
                <input 
                    type="text" 
                    id="yeniMahalInput" 
                    placeholder="Yeni mahal adı..." 
                    class="border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 p-2.5 rounded-lg w-full text-sm outline-none focus:border-blue-500 transition-all"
                />
                <button onclick="mahalEkle()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 rounded-lg font-bold transition-colors shadow-sm">+</button>
            </div>

            <!-- Mahal Listesi -->
            <div id="mahalListesi" class="flex-1 overflow-y-auto space-y-2"></div>
        </div>

        <!-- ORTA SÜRÜKLEME ÇUBUĞU -->
        <div id="ayrac" class="w-1.5 bg-slate-200 dark:bg-slate-800 hover:bg-blue-500 transition-colors flex items-center justify-center cursor-col-resize"></div>

        <!-- SAĞ PANEL: İş Ekleme ve Detaylı Arama -->
        <div id="sagPanel" class="p-5 bg-slate-50 dark:bg-slate-950 overflow-y-auto flex flex-col flex-1 transition-colors duration-200">
            <div id="sagPanelIcerik" class="flex flex-col h-full">
                <div class="flex flex-col items-center justify-center h-full text-slate-400 dark:text-slate-600 gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 stroke-slate-300 dark:stroke-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                    <p class="text-sm">İşlem yapmak için sol panelden bir mahal seçin.</p>
                </div>
            </div>
        </div>
        
    </div>

    <!-- İŞ DÜZENLEME MODALI -->
    <div id="duzenleModal" class="fixed inset-0 bg-slate-950 bg-opacity-40 dark:bg-opacity-70 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 p-6 rounded-2xl w-96 shadow-2xl">
            <h3 class="text-base font-bold mb-4 text-slate-800 dark:text-slate-100">İş Kaydını Düzenle</h3>
            <input type="hidden" id="duzenleId" />
            
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Mahal Değiştir</label>
            <select id="duzenleMahalSelect" class="border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 p-2.5 rounded-lg w-full mb-3 text-sm outline-none focus:border-blue-500">
                <!-- JavaScript ile doldurulacak -->
            </select>

            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Tarih</label>
            <input type="date" id="duzenleTarih" class="border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 p-2.5 rounded-lg w-full mb-3 text-sm outline-none focus:border-blue-500" />
            
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">İşi Yapan Kişi</label>
            <input type="text" id="duzenleYapanKisi" placeholder="İşi yapan kişi..." class="border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 p-2.5 rounded-lg w-full mb-3 text-sm outline-none focus:border-blue-500" />

            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Yapılan İş</label>
            <textarea id="duzenleYapilanIs" placeholder="Yapılan iş..." class="border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 p-2.5 rounded-lg w-full mb-4 text-sm outline-none h-24 focus:border-blue-500 resize-none"></textarea>
            
            <div class="flex justify-end gap-2">
                <button onclick="modalKapat()" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 px-4 py-2 rounded-lg text-xs font-bold transition-colors">İptal</button>
                <button onclick="duzenlemeKaydet()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition-colors">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- MAHAL DÜZENLEME MODALI -->
    <div id="mahalDuzenleModal" class="fixed inset-0 bg-slate-950 bg-opacity-40 dark:bg-opacity-70 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 p-6 rounded-2xl w-96 shadow-2xl">
            <h3 class="text-base font-bold mb-4 text-slate-800 dark:text-slate-100">Mahal Adını Düzenle</h3>
            <input type="hidden" id="mahalDuzenleId" />
            
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Mahal Adı</label>
            <input type="text" id="mahalDuzenleAdi" class="border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 p-2.5 rounded-lg w-full mb-4 text-sm outline-none focus:border-blue-500" />
            
            <div class="flex justify-end gap-2">
                <button onclick="mahalModalKapat()" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 px-4 py-2 rounded-lg text-xs font-bold transition-colors">İptal</button>
                <button onclick="mahalDuzenlemeKaydet()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition-colors">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cbwhkgngbecagunjkvid.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNid2hrZ25nYmVjYWd1bmprdmlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1OTM0NDAsImV4cCI6MjEwOTE2OTQ0MH0.xWe2gWHR0DRdl_YUm08ON7nhzDxdeMVkBgGaK1nwWX0';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let mahaller = [];
        let isKayitlari = [];
        let seciliMahal = null;

        // Tema Ayarları
        function temaDegistir() {
            const html = document.documentElement;
            const btn = document.getElementById('temaBtn');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('tema', 'light');
                btn.innerHTML = '🌙 Karanlık Mod';
            } else {
                html.classList.add('dark');
                localStorage.setItem('tema', 'dark');
                btn.innerHTML = '☀️ Aydınlık Mod';
            }
        }

        // Sayfa açıldığında kayıtlı temayı yükle
        if (localStorage.getItem('tema') === 'dark' || (!localStorage.getItem('tema') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.addEventListener('DOMContentLoaded', () => {
                const btn = document.getElementById('temaBtn');
                if(btn) btn.innerHTML = '☀️ Aydınlık Mod';
            });
        }

        async function verileriGetir() {
            const { data: mahalData } = await _supabase.from('mahaller').select('*');
            if (mahalData) mahaller = mahalData;

            const { data: isData } = await _supabase.from('is_kayitlari').select('*');
            if (isData) isKayitlari = isData;

            mahalleriniGoster();
            if(seciliMahal) sagPaneliGoster();
        }

        // Mahalleri Sol Ekranda Listele
        function mahalleriniGoster() {
            const aramaMetni = document.getElementById('solAramaInput').value.toLowerCase();
            const listeDiv = document.getElementById('mahalListesi');
            listeDiv.innerHTML = '';

            const filtrelenmis = mahaller.filter(m => m.mahal_adi.toLowerCase().includes(aramaMetni));

            filtrelenmis.forEach(mahal => {
                const isSecili = seciliMahal && seciliMahal.id === mahal.id;
                const kayitSayisi = isKayitlari.filter(i => i.mahal_id === mahal.id).length;
                
                let html = `
                    <div class="border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden transition-all shadow-sm bg-white dark:bg-slate-900">
                        <div class="p-3.5 font-medium flex justify-between items-center cursor-pointer transition-colors ${isSecili ? 'bg-blue-50 dark:bg-slate-800 text-blue-900 dark:text-blue-400 border-l-4 border-blue-600' : 'hover:bg-slate-50 dark:hover:bg-slate-800/50 text-slate-700 dark:text-slate-300'}" onclick="mahalTikla('${mahal.id}')">
                            <div class="flex items-center gap-2 flex-1 truncate mr-2">
                                <span class="font-semibold text-sm truncate">${mahal.mahal_adi}</span>
                                <span class="text-[11px] bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 px-2 py-0.5 rounded-full font-medium whitespace-nowrap border border-slate-200 dark:border-slate-700">${kayitSayisi} giriş</span>
                            </div>
                            <div class="flex items-center gap-1.5" onclick="event.stopPropagation()">
                                <button onclick="mahalDuzenleModalAc('${mahal.id}')" class="text-xs bg-amber-50 dark:bg-amber-950/50 hover:bg-amber-100 text-amber-700 dark:text-amber-400 px-2 py-1 rounded-md font-semibold transition-colors">Düzenle</button>
                                <button onclick="mahalSil('${mahal.id}')" class="text-xs bg-rose-50 dark:bg-rose-950/50 hover:bg-rose-100 text-rose-600 dark:text-rose-400 px-2 py-1 rounded-md font-semibold transition-colors">Sil</button>
                                <span class="text-xs text-slate-400 ml-1">${isSecili ? '▲' : '▼'}</span>
                            </div>
                        </div>
                `;

                if (isSecili) {
                    const oMahalinIsleri = isKayitlari
                        .filter(i => i.mahal_id === mahal.id)
                        .sort((a, b) => new Date(b.tarih) - new Date(a.tarih));

                    html += `<div class="p-3 bg-slate-50 dark:bg-slate-950 text-sm border-t border-slate-200 dark:border-slate-800 space-y-2">
                                <h4 class="font-semibold text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Geçmiş Kayıtlar</h4>`;
                    
                    if (oMahalinIsleri.length > 0) {
                        oMahalinIsleri.forEach(is => {
                            html += `
                                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 rounded-lg shadow-2xs flex flex-col gap-1.5">
                                    <div class="flex justify-between items-center">
                                        <div class="flex items-center gap-2">
                                            <span class="text-blue-600 dark:text-blue-400 font-bold text-xs">${is.tarih}</span>
                                            <div class="flex gap-1">
                                                <button onclick="duzenleModalAc('${is.id}')" class="text-[10px] bg-amber-50 dark:bg-amber-950/50 hover:bg-amber-100 text-amber-700 dark:text-amber-400 px-2 py-0.5 rounded font-semibold transition-colors">Düzenle</button>
                                                <button onclick="isSil('${is.id}')" class="text-[10px] bg-rose-50 dark:bg-rose-950/50 hover:bg-rose-100 text-rose-600 dark:text-rose-400 px-2 py-0.5 rounded font-semibold transition-colors">Sil</button>
                                            </div>
                                        </div>
                                        <span class="text-slate-500 dark:text-slate-400 italic text-xs">Yapan: ${is.yapan_kisi || 'Belirtilmemiş'}</span>
                                    </div>
                                    <div class="text-slate-800 dark:text-slate-200 text-sm font-medium">${is.yapilan_is}</div>
                                </div>`;
                        });
                    } else {
                        html += `<p class="text-slate-400 dark:text-slate-500 text-xs italic">Henüz kayıt yok.</p>`;
                    }
                    html += `</div>`;
                }

                html += `</div>`;
                listeDiv.innerHTML += html;
            });
        }

        function filtreleMahaller() {
            mahalleriniGoster();
        }

        async function mahalTikla(id) {
            if (seciliMahal && seciliMahal.id === id) {
                seciliMahal = null;
                document.getElementById('sagPanelIcerik').innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-400 dark:text-slate-600 gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 stroke-slate-300 dark:stroke-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                        <p class="text-sm">İşlem yapmak için sol panelden bir mahal seçin.</p>
                    </div>`;
            } else {
                seciliMahal = mahaller.find(m => m.id === id);
                sagPaneliGoster();
            }
            mahalleriniGoster();
        }

        function sagPaneliGoster() {
            const sagDiv = document.getElementById('sagPanelIcerik');
            if (!seciliMahal) return;

            sagDiv.innerHTML = `
                <h2 class="text-lg font-bold mb-4 text-slate-800 dark:text-slate-100 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 bg-blue-600 rounded-full"></span>
                    ${seciliMahal.mahal_adi} <span class="text-xs text-slate-500 dark:text-slate-400 font-normal">/ İş Kayıtları</span>
                </h2>
                
                <div class="mb-4">
                    <input 
                        type="text" 
                        id="sagAramaInput" 
                        placeholder="Tarih, kişi veya kelime ara..." 
                        class="border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 p-2.5 rounded-lg w-full text-sm outline-none focus:border-blue-500 shadow-sm transition-all"
                        oninput="isleriFiltreleGoster()"
                    />
                </div>

                <div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 mb-5 flex flex-col gap-3 shadow-sm">
                    <h3 class="font-bold text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider">Yeni İş Ekle</h3>
                    <div class="flex gap-2 items-center">
                        <input type="date" id="yeniTarih" class="border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 p-2.5 rounded-lg w-1/2 outline-none text-sm focus:border-blue-500" />
                        <button onclick="bugununTarihiniYaz()" class="bg-slate-700 dark:bg-slate-800 hover:bg-slate-800 dark:hover:bg-slate-700 text-white px-3 py-2.5 rounded-lg text-xs font-bold transition-colors whitespace-nowrap">Bugün</button>
                    </div>
                    <input type="text" id="yeniYapanKisi" placeholder="İşi yapan kişi..." class="border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 p-2.5 rounded-lg w-full outline-none text-sm focus:border-blue-500" />
                    <div class="flex gap-2">
                        <input type="text" id="yeniIsTanimi" placeholder="Yapılan işi detaylı yazın..." class="border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 p-2.5 rounded-lg w-full outline-none text-sm focus:border-blue-500" />
                        <button onclick="isEkle()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 rounded-lg font-bold transition-colors shadow-sm">+</button>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto space-y-2.5" id="sagIsListesi"></div>
            `;
            isleriFiltreleGoster();
        }

        function bugununTarihiniYaz() {
            const bugun = new Date().toISOString().split('T')[0];
            document.getElementById('yeniTarih').value = bugun;
        }

        function isleriFiltreleGoster() {
            const arama = document.getElementById('sagAramaInput').value.toLowerCase();
            const listeDiv = document.getElementById('sagIsListesi');
            listeDiv.innerHTML = '';

            const filtrelenmis = isKayitlari.filter(is => {
                if (is.mahal_id !== seciliMahal.id) return false;
                const yapan = is.yapan_kisi ? is.yapan_kisi.toLowerCase() : '';
                return is.yapilan_is.toLowerCase().includes(arama) || is.tarih.includes(arama) || yapan.includes(arama);
            }).sort((a, b) => new Date(b.tarih) - new Date(a.tarih));

            if (filtrelenmis.length > 0) {
                filtrelenmis.forEach(is => {
                    listeDiv.innerHTML += `
                        <div class="p-3.5 border border-slate-200 dark:border-slate-800 flex justify-between items-center bg-white dark:bg-slate-900 rounded-xl shadow-sm hover:border-slate-300 dark:hover:border-slate-700 transition-all">
                            <div class="space-y-1.5 flex-1">
                                <div class="flex items-center gap-3">
                                    <span class="text-blue-600 dark:text-blue-400 font-bold text-xs">${is.tarih}</span>
                                    <div class="flex gap-1">
                                        <button onclick="duzenleModalAc('${is.id}')" class="text-xs bg-amber-50 dark:bg-amber-950/50 hover:bg-amber-100 text-amber-700 dark:text-amber-400 px-2 py-0.5 rounded font-semibold transition-colors">Düzenle</button>
                                        <button onclick="isSil('${is.id}')" class="text-xs bg-rose-50 dark:bg-rose-950/50 hover:bg-rose-100 text-rose-600 dark:text-rose-400 px-2 py-0.5 rounded font-semibold transition-colors">Sil</button>
                                    </div>
                                    <span class="text-slate-500 dark:text-slate-400 italic text-xs ml-auto">Yapan: ${is.yapan_kisi || 'Belirtilmemiş'}</span>
                                </div>
                                <div class="text-slate-800 dark:text-slate-200 text-sm font-medium">${is.yapilan_is}</div>
                            </div>
                        </div>
                    `;
                });
            } else {
                listeDiv.innerHTML = `<p class="text-slate-400 dark:text-slate-500 text-sm italic text-center py-6">Eşleşen kayıt bulunamadı.</p>`;
            }
        }

        async function mahalEkle() {
            const input = document.getElementById('yeniMahalInput');
            const mahalAdi = input.value.trim();
            if (!mahalAdi) return;

            const { data, error } = await _supabase.from('mahaller').insert([{ mahal_adi: mahalAdi }]).select();
            if (error) {
                alert("Mahal eklenirken hata: " + error.message);
                return;
            }
            if (data) {
                mahaller.push(data[0]);
                input.value = '';
                mahalleriniGoster();
            }
        }

        async function mahalSil(id) {
            if (!confirm("Bu mahali ve bağlı tüm iş kayıtlarını silmek istediğinize emin misiniz?")) return;

            const { error } = await _supabase.from('mahaller').delete().eq('id', id);
            if (error) {
                alert("Silme hatası: " + error.message);
                return;
            }

            mahaller = mahaller.filter(m => m.id !== id);
            isKayitlari = isKayitlari.filter(i => i.mahal_id !== id);
            
            if (seciliMahal && seciliMahal.id === id) {
                seciliMahal = null;
                document.getElementById('sagPanelIcerik').innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-400 dark:text-slate-600 gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 stroke-slate-300 dark:stroke-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                        <p class="text-sm">İşlem yapmak için sol panelden bir mahal seçin.</p>
                    </div>`;
            }
            mahalleriniGoster();
        }

        function mahalDuzenleModalAc(id) {
            const mahal = mahaller.find(m => m.id === id);
            if (!mahal) return;

            document.getElementById('mahalDuzenleId').value = mahal.id;
            document.getElementById('mahalDuzenleAdi').value = mahal.mahal_adi;
            document.getElementById('mahalDuzenleModal').classList.remove('hidden');
        }

        function mahalModalKapat() {
            document.getElementById('mahalDuzenleModal').classList.add('hidden');
        }

        async function mahalDuzenlemeKaydet() {
            const id = document.getElementById('mahalDuzenleId').value;
            const mahalAdi = document.getElementById('mahalDuzenleAdi').value.trim();

            if (!mahalAdi) {
                alert("Mahal adı boş bırakılamaz.");
                return;
            }

            const { error } = await _supabase.from('mahaller').update({ mahal_adi: mahalAdi }).eq('id', id);

            if (error) {
                alert("Güncelleme hatası: " + error.message);
                return;
            }

            const index = mahaller.findIndex(m => m.id === id);
            if (index !== -1) {
                mahaller[index].mahal_adi = mahalAdi;
            }

            mahalModalKapat();
            mahalleriniGoster();
            if (seciliMahal && seciliMahal.id === id) {
                sagPaneliGoster();
            }
        }

        async function isEkle() {
            const tarih = document.getElementById('yeniTarih').value;
            const yapanKisi = document.getElementById('yeniYapanKisi').value.trim();
            const yapilanIs = document.getElementById('yeniIsTanimi').value.trim();
            if (!tarih || !yapilanIs || !seciliMahal) return;

            const { data, error } = await _supabase.from('is_kayitlari').insert([{
                mahal_id: seciliMahal.id,
                tarih: tarih,
                yapan_kisi: yapanKisi,
                yapilan_is: yapilanIs
            }]).select();

            if (error) {
                alert("İş eklenirken hata: " + error.message);
                return;
            }
            if (data) {
                isKayitlari.push(data[0]);
                document.getElementById('yeniTarih').value = '';
                document.getElementById('yeniYapanKisi').value = '';
                document.getElementById('yeniIsTanimi').value = '';
                mahalleriniGoster(); 
                isleriFiltreleGoster(); 
            }
        }

        async function isSil(id) {
            if (!confirm("Bu iş kaydını silmek istediğinize emin misiniz?")) return;

            const { error } = await _supabase.from('is_kayitlari').delete().eq('id', id);
            if (error) {
                alert("Silme hatası: " + error.message);
                return;
            }

            isKayitlari = isKayitlari.filter(i => i.id !== id);
            mahalleriniGoster();
            if (seciliMahal) isleriFiltreleGoster();
        }

        function duzenleModalAc(id) {
            const kayit = isKayitlari.find(i => i.id === id);
            if (!kayit) return;

            document.getElementById('duzenleId').value = kayit.id;
            
            const select = document.getElementById('duzenleMahalSelect');
            select.innerHTML = '';
            mahaller.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.mahal_adi;
                if (m.id === kayit.mahal_id) opt.selected = true;
                select.appendChild(opt);
            });

            document.getElementById('duzenleTarih').value = kayit.tarih;
            document.getElementById('duzenleYapanKisi').value = kayit.yapan_kisi || '';
            document.getElementById('duzenleYapilanIs').value = kayit.yapilan_is;
            document.getElementById('duzenleModal').classList.remove('hidden');
        }

        function modalKapat() {
            document.getElementById('duzenleModal').classList.add('hidden');
        }

        async function duzenlemeKaydet() {
            const id = document.getElementById('duzenleId').value;
            const yeniMahalId = document.getElementById('duzenleMahalSelect').value;
            const tarih = document.getElementById('duzenleTarih').value;
            const yapanKisi = document.getElementById('duzenleYapanKisi').value.trim();
            const yapilanIs = document.getElementById('duzenleYapilanIs').value.trim();

            if (!tarih || !yapilanIs) {
                alert("Tarih ve yapılan iş boş bırakılamaz.");
                return;
            }

            const { error } = await _supabase.from('is_kayitlari').update({
                mahal_id: yeniMahalId,
                tarih: tarih,
                yapan_kisi: yapanKisi,
                yapilan_is: yapilanIs
            }).eq('id', id);

            if (error) {
                alert("Güncelleme hatası: " + error.message);
                return;
            }

            const index = isKayitlari.findIndex(i => i.id === id);
            if (index !== -1) {
                isKayitlari[index].mahal_id = yeniMahalId;
                isKayitlari[index].tarih = tarih;
                isKayitlari[index].yapan_kisi = yapanKisi;
                isKayitlari[index].yapilan_is = yapilanIs;
            }

            modalKapat();
            mahalleriniGoster();
            if (seciliMahal) isleriFiltreleGoster();
        }

        // Panelleri Boyutlandırma Sürükleme Mantığı
        const ayrac = document.getElementById('ayrac');
        const solPanel = document.getElementById('solPanel');
        const anaKapsayici = document.getElementById('anaKapsayici');
        let aktifSurukleme = false;

        ayrac.addEventListener('mousedown', () => {
            aktifSurukleme = true;
            document.body.style.cursor = 'col-resize';
        });

        window.addEventListener('mousemove', (e) => {
            if (!aktifSurukleme) return;
            const toplamGenislik = anaKapsayici.offsetWidth;
            const yeniGenislik = (e.clientX / toplamGenislik) * 100;
            if (yeniGenislik >= 20 && yeniGenislik <= 80) {
                solPanel.style.width = yeniGenislik + '%';
            }
        });

        window.addEventListener('mouseup', () => {
            aktifSurukleme = false;
            document.body.style.cursor = 'default';
        });

        verileriGetir();
    </script>
</body>
</html>
